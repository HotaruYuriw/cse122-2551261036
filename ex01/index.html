  <!DOCTYPE html>
  <html>
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>First Lesson</title>
          <style>
              .khung-tho {
                width: 640px;
                padding: 24px;
                background: #FFFDE7;
                border: 1px solid #9E9E9E;
                text-align: center;
                margin: 20px auto;
                display: flexbox;
                font-family: 'Times New Roman' ;
              }

              h1 {
                color: #D40000;
                background: #FFD9E6;
                font-size: 26px;
                padding: 6px 0;
                margin: 0 0 20px;
              }
              .khoxanh {
                  color: #0033CC;
                  line-height: 1.7;
                  font-style: italic;
              }
              .khodo {
                  color: #D40000;
                  line-height: 1.7;
                  font-style: italic;
              }
              hr{
                  width: 55%;
                  color: blue;
                  border: none;
                  border-top: 2px solid blue;
              }
          </style>
      </head>
      <body>
          <article class="khung-tho" lang = vi>
          <article style="text-align: center" lang = "vi">
              <h1>Bốn mùa</h1>
              <p class="khoxanh">
              Xuân về hoa nở khắp nơi<br>
              Hạ sang nắng cháy rạng ngời phố quen<br>
              Thu về lá rụng bên thềm</p>
              <hr>
              <p class="khodo">
              Đông sang gió lạnh bên em đợi chờ<br>
              Bốn mùa là bốn giấc mơ<br>
              Thời gian đi mãi ta đợi chờ ai</p>
              <hr>
              <p class="khoxanh">
              Một năm rồi lại một năm<br>
              Vẫn còn câu hát thì thầm quê hương<br>
              Chờ xuân nắng mới soi đường</p>
              <br>
          </article>

      </body>
  </html>
